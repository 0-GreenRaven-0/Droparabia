# Builds the static site and rsyncs dist/ to the CloudPanel box on every push to main.
# The server itself has no git/CI integration — this workflow is what makes a push deploy.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-deploy by hand from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Trailing slash on dist/ copies the contents, not the folder itself.
      # --delete keeps the server from accumulating files deleted from the repo.
      - name: Rsync to server
        run: |
          rsync -avz --delete dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/droparabia/htdocs/www.droparabia.com/dist/
